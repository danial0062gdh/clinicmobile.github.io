<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کلینیک موبایل فراه</title>
    <style> 
        /* تنظیمات پایه */
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Tahoma', sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* پس‌زمینه ذرات */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* کارت شیشه‌ای شفاف */
        .glass-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 20px; margin-bottom: 15px; }
        p { font-size: 14px; opacity: 0.9; margin-bottom: 20px; }

        /* اسلایدر عکس */
        .slider-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .slider {
            display: flex;
            width: 300%;
            height: 100%;
            transition: transform 1s ease-in-out;
        }

        .slider img {
            width: 33.33%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        /* دکمه نقشه */
        .map-btn {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

        .map-btn:hover { background-color: #2563eb; }

        /* دیوِلوپر */
        .developer-info {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.6;
        }

        .developer-info a { color: #3b82f6; text-decoration: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>

    <div id="particles-js"></div>

    <div class="glass-card">
        <h1>📱 دکان کلینیک موبایل</h1>
        
        <div class="slider-container">
            <div class="slider">
                <img src="https://i.ibb.co/Z1Kfz8KY/IMG-20260312-165346.jpg" alt="عکس 1">
                <img src="https://i.ibb.co/dsQ3TFqy/IMG-20260312-165647.jpg" alt="عکس 2">
                <img src="https://i.ibb.co/Z1Kfz8KY/IMG-20260312-165346.jpg" alt="عکس 3">
            </div>
        </div>

        <p>مرکز تخصصی تعمیرات و فروش موبایل در فراه.</p>
        
        <a href="https://maps.app.goo.gl/6Q5JXKwqnm9gKDv86" target="_blank" class="map-btn">
            مشاهده روی نقشه 📍
        </a>

        <div class="developer-info">
            Developed by: <a href="https://t.me/danial_13pro" target="_blank">@danial_13pro</a>
        </div>
    </div>

    <script>
        // تنظیمات ذرات
        particlesJS('particles-js', {
          particles: {
            number: { value: 80, density: { enable: true, value_area: 800 } },
            color: { value: '#ffffff' },
            shape: { type: 'circle' },
            opacity: { value: 0.5, random: true },
            size: { value: 3, random: true },
            line_linked: { enable: false },
            move: { enable: true, speed: 1, direction: 'none', random: true, straight: false, out_mode: 'out' }
          },
          interactivity: { enable: false },
          retina_detect: true
        });

        // تنظیمات اسلایدر
        const slider = document.querySelector('.slider');
        const images = document.querySelectorAll('.slider img');
        let currentIndex = 0;

        function nextImage() {
          currentIndex++;
          if (currentIndex >= images.length) {
            currentIndex = 0;
          }
          // چون جهت فارسی راست‌به‌چپ (RTL) هست، باید از مثبت استفاده کنیم تا عکس جابجا بشه
          slider.style.transform = `translateX(${currentIndex * 33.33}%)`;
        }

        setInterval(nextImage, 3000);
    </script>
</body>
</html>
